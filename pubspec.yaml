  # Network & Local Storage
  dio: ^5.3.3
  shared_preferences: ^2.2.1
  
  # UI & Styling
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

